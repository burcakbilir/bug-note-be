services:
  postgres:
    image: postgres:16-alpine
    container_name: bug-note-be-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bug_note_be_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - bug-note-be-postgres:/var/lib/postgresql/data

volumes:
  bug-note-be-postgres:
